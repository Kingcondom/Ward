# Fly.io — ฟรี/ราคาถูก และมี volume เก็บข้อมูลถาวร
# วิธีใช้:  fly launch --no-deploy  →  fly volumes create ward_data --size 1
#          fly secrets set WARD_PASSCODE='รหัสของคุณ'  →  fly deploy
app = "ward"
primary_region = "sin"   # สิงคโปร์ — ใกล้ไทยที่สุด

[build]

[env]
  PORT = "3000"
  WARD_DB = "/data/ward.db"
  # เครื่องบนคลาวด์ตั้งเวลาเป็น UTC ถ้าไม่ตั้งอันนี้ ช่วงเที่ยงคืน-7 โมงเช้าบ้านเรา
  # ระบบจะนับว่ายังเป็นเมื่อวาน (เวรดึกบันทึก SOAP แล้ววันที่เพี้ยน)
  TZ = "Asia/Bangkok"
  # สำรองฐานข้อมูลอัตโนมัติทุกวันตี 3 ลงใน volume (Fly ไม่มี cron ให้ตั้ง)
  WARD_AUTO_BACKUP = "03:00"
  WARD_BACKUP_DIR = "/data/backups"

[[mounts]]
  source = "ward_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # เปิดค้างตลอด 24 ชม. — ห้ามให้เครื่องหลับ เพราะ real-time (SSE) จะหลุด
  # และคนที่เปิดลิงก์ค้างไว้จะเจอหน้าเว็บค้างตอนเครื่องตื่น
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # ให้ Fly เช็กว่าเซิร์ฟเวอร์ยังตอบอยู่จริง ถ้าไม่ตอบจะรีสตาร์ทให้เอง
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/version"

# real-time ใช้ SSE ที่เปิดค้างไว้ จึงต้องให้ทุก request ไปเครื่องเดียวกัน
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
